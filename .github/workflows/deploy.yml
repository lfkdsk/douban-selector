name: Deploy to Pages

on:
  push:
    branches: [main]
  # sync.yml pushes with GITHUB_TOKEN, and pushes made with that token never
  # fire `push` workflows, so chain off the sync run instead.
  workflow_run:
    workflows: ["Sync Douban Data"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Stage deploy bundle (without poster cache)
        # Posters live in main for jsDelivr to serve, but excluding them from
        # the Pages artifact keeps the deploy under a few MB.
        run: |
          mkdir -p _site
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='scripts' \
            --exclude='_site' \
            --exclude='data/posters' \
            ./ _site/
          echo "── deploy bundle layout ──"
          ls -la _site
          du -sh _site _site/data 2>/dev/null || true

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
